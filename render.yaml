services:
  - type: web
    name: equi-metrics-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: equi_metrics
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Optional — see backend/.env.example. Lets CORS also allow Vercel
      # preview-deployment URLs, which don't match a single fixed FRONTEND_URL.
      - key: FRONTEND_PREVIEW_ORIGIN_REGEX
        sync: false
